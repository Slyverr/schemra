[workspace]
members = [
  "crates/schemra-cli",
  "crates/schemra-compiler",
  "crates/schemra-engine",
  "crates/schemra-ir",
  "crates/schemra-syntax",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemra-syntax = { path = "crates/schemra-syntax" }
schemra-ir = { path = "crates/schemra-ir" }
