[workspace]
members = [
  "crates/schemra-cli",
  "crates/schemra-compiler",
  "crates/schemra-engine",
  "crates/schemra-ir",
  "crates/schemra-lsp",
  "crates/schemra-project",
  "crates/schemra-renderer",
  "crates/schemra-scene",
  "crates/schemra-syntax",
  "crates/schemra-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
cosmic-text = { version = "0.16", default-features = false, features = ["std"] }
unicode-script = "0.5.8"
unicode-segmentation = "1.13.3"
schemra-syntax = { path = "crates/schemra-syntax" }
schemra-project = { path = "crates/schemra-project" }
schemra-ir = { path = "crates/schemra-ir" }
schemra-lsp = { path = "crates/schemra-lsp" }
schemra-renderer = { path = "crates/schemra-renderer" }
schemra-scene = { path = "crates/schemra-scene" }
schemra-compiler = { path = "crates/schemra-compiler" }
schemra-engine = { path = "crates/schemra-engine" }
wasm-bindgen = "=0.2.129"
